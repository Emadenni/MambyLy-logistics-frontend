    <!--
      Boot. The same index.html serves the public site, admin/login and Sido Butik.
      This inline script only picks the loader, image preloads and icons for the entry route;
      it does not touch routing, authentication or application state.
      "legacy" (/admin, /login, /sidoButik…) gets exactly the previous loader, preloads and icons.
    -->
    <script src="/boot/route.js"></script>
    <style>
      html[data-boot="public"] { background: #f6f4ee; }
      /* Public loader: the home veil's own picture (logo, tagline, the cover's colours) with a
         loading ring where the swipe control will be. On the home page the veil takes over at once
         and keeps the ring until the page is ready; elsewhere this lifts away (src/main.tsx). */
      #initial-loader.mp-boot {
        position: fixed; inset: 0; z-index: 9999;
        background:
          radial-gradient(120% 60% at 70% 105%, rgba(36, 123, 103, 0.42), transparent 60%),
          radial-gradient(85% 55% at 0% 0%, rgba(16, 59, 53, 0.62), transparent 66%),
          radial-gradient(60% 45% at 100% 42%, rgba(29, 80, 71, 0.48), transparent 66%),
          url("/media/mambyly/hero-glass-1024.webp") center / cover no-repeat,
          #f6f4ee;
        transition: transform 0.75s cubic-bezier(0.7, 0, 0.2, 1), visibility 0s 0.75s;
      }
      #initial-loader.mp-boot.is-done { transform: translateY(-100%); visibility: hidden; }
      .mp-boot__brand { position: absolute; top: 43%; left: 50%; display: grid; justify-items: center; transform: translateX(-50%); }
      .mp-boot__logo { width: clamp(210px, 64vw, 340px); height: auto; margin-top: calc(clamp(210px, 64vw, 340px) * -0.1417); }
      .mp-boot__tagline {
        margin: 18px 0 0; color: #103b35; white-space: nowrap;
        font: 400 clamp(19px, 5.2vw, 24px) / 1.3 "MP Poppins", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.01em;
      }
      .mp-boot__ring { position: absolute; left: 50%; bottom: calc(max(34px, env(safe-area-inset-bottom) + 22px) + 60px); width: 116px; height: 116px; transform: translateX(-50%); }
      .mp-load { display: block; width: 100%; height: 100%; }
      .mp-load__arc { transform-origin: 58px 58px; animation: mp-load-turn 1.5s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite; }
      .mp-load__dot { transform-origin: 58px 58px; animation: mp-load-dot 1.5s ease-in-out infinite; }
      .mp-boot__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes mp-load-turn { to { transform: rotate(360deg); } }
      @keyframes mp-load-dot { 0%, 100% { transform: scale(0.7); opacity: 0.55; } 50% { transform: scale(1.15); opacity: 1; } }
      @media (max-height: 560px) {
        .mp-boot__logo { width: clamp(150px, 42vh, 230px); margin-top: calc(clamp(150px, 42vh, 230px) * -0.1417); }
        .mp-boot__ring { width: 76px; height: 76px; bottom: calc(max(34px, env(safe-area-inset-bottom) + 22px) + 50px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mp-load__arc, .mp-load__dot { animation: none; }
        #initial-loader.mp-boot { transition: visibility 0s; }
        #initial-loader.mp-boot.is-done { transform: none; }
      }
    </style>
